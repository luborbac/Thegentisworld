<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Check-in — Mimos</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-amber-50 text-stone-800 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-stone-200 p-8 text-center">

    <div id="loading" class="text-stone-400">Carregando...</div>
    <p id="error" class="hidden text-rose-600"></p>

    <div id="form-section" class="hidden">
      <h1 id="shop-name" class="text-xl font-bold text-amber-700 mb-1"></h1>
      <p id="shop-points-info" class="text-sm text-stone-500 mb-6"></p>
      <form id="checkin-form" class="space-y-3 text-left">
        <label class="block text-sm text-stone-600">Seu telefone</label>
        <input id="phone" type="tel" required placeholder="(00) 00000-0000"
          class="w-full border border-stone-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400" />
        <label class="block text-sm text-stone-600">Nome (opcional)</label>
        <input id="name" placeholder="Seu nome"
          class="w-full border border-stone-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400" />
        <button id="submit-btn" type="submit"
          class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium rounded-lg py-2.5 transition">Confirmar check-in</button>
      </form>
    </div>

    <div id="result-section" class="hidden">
      <p class="text-4xl mb-3">🎉</p>
      <h2 class="text-lg font-bold mb-1">Valeu, <span id="result-name"></span>!</h2>
      <p class="text-stone-500 text-sm">Você agora tem</p>
      <p class="text-4xl font-bold text-amber-700 my-2"><span id="result-balance"></span> pts</p>
      <p class="text-stone-400 text-xs">Volte sempre para acumular mais mimos.</p>
    </div>

  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/checkin.js"></script>
</body>
</html>
